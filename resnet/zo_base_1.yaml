# SeedFlood ZO base config (CLI 인자가 이 값들을 override함)
mode: zo_adam
model: resnet20
dtype: fp32
norm: group
act: silu        # relu | gelu | silu | softplus | elu | leaky_relu | tanh

# 초기화
init: kaiming_normal
init_gain: 1.0
fc_scale: 1.0
zero_init_residual: false

lr: 3.0e-5
mu: 2.5e-3
batch_size: 128
n_rounds: 3000
eval_every: 200
warmup_rounds: 200
lr_schedule: constant

# FO warmup (진단용: 0이면 순수 ZO)
fo_warmup_steps: 0
fo_warmup_lr: 0.05

beta1: 0.99
beta2: 0.999
zo_weight_decay: 0.0
n_nodes: 4
n_queries: 1     # 라운드당 z 방향 수 (분산 1/Q, forward 비용 2Q배)
seed_mode: shared  # shared | per_node

# 진단
precision_probe: true
bias3_probe: true
curvature_check: true
early_abort: true
abort_min_round: 1000
abort_ratio: 100.0
